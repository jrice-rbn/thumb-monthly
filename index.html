<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>The Thumb Monthly</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{color-scheme:light;--page:#F3F2EC;--surface:#FCFCFA;--ink:#1A1916;--ink-2:#5C594F;--muted:#8C8980;--axis:#C9C6BC;--border:rgba(26,25,22,.10);--bad:#c23636;--accent:#2a78d6}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#111110;--surface:#1B1B19;--ink:#F4F3EE;--ink-2:#C4C1B5;--muted:#8C8980;--axis:#3A3A36;--border:rgba(255,255,255,.10);--bad:#e66767;--accent:#3987e5}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--page);color:var(--ink);font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;font-size:14px}
.box{width:min(380px,calc(100% - 32px));background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px 28px 24px}
h1{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0 0 2px}
.sub{color:var(--ink-2);font-size:13px;margin:0 0 22px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--axis);border-radius:8px;background:var(--page);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.rem{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-size:13px}
button{font:inherit;font-weight:500;padding:9px 16px;border-radius:8px;border:0;background:var(--ink);color:var(--page);cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.6;cursor:default}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.foot{margin-top:18px;font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <h1>The Thumb</h1>
  <p class="sub">Monthly performance. This page is encrypted; enter the password to open it.</p>
  <label for="pw">Password</label>
  <input type="password" id="pw" autocomplete="current-password" autofocus>
  <div class="row">
    <label class="rem" style="text-transform:none;letter-spacing:0;font-size:13px;margin:0"><input type="checkbox" id="rem" checked> Remember on this device</label>
    <button type="submit" id="go">Open</button>
  </div>
  <div class="err" id="err"></div>
  <div class="foot">Decryption happens in your browser. Nothing is sent anywhere.</div>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function open(key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function tryRemembered(){
  try{ const raw = localStorage.getItem('ttm-key'); const exp = +localStorage.getItem('ttm-exp')||0;
    if(raw && exp > Date.now()){ const key = await crypto.subtle.importKey('raw', b64(raw), {name:'AES-GCM'}, true, ['decrypt']); await open(key); }
    else if(raw){ localStorage.removeItem('ttm-key'); localStorage.removeItem('ttm-exp'); }
  }catch(e){ try{localStorage.removeItem('ttm-key');}catch(_){} }
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault(); const btn=document.getElementById('go'), err=document.getElementById('err'); btn.disabled=true; err.textContent=''; btn.textContent='Opening…';
  try{
    const key = await deriveKey(document.getElementById('pw').value);
    if(document.getElementById('rem').checked){ try{ const raw=new Uint8Array(await crypto.subtle.exportKey('raw', key)); localStorage.setItem('ttm-key', btoa(String.fromCharCode(...raw))); localStorage.setItem('ttm-exp', String(Date.now()+30*864e5)); }catch(_){} }
    await open(key);
  }catch(ex){ err.textContent='That password did not work.'; btn.disabled=false; btn.textContent='Open'; document.getElementById('pw').select(); }
});
tryRemembered();
